# Keio Tsushin Course Catalog
# Add courses from the official study guide here.
#
# Fields (academic field / 分野):
#   - humanities: 人文科学分野
#   - social: 社会科学分野
#   - natural: 自然科学分野
#   - foreign_language: 外国語科目
#   - economics: 経済学部専門教育科目
#
# Types:
#   - distance: 通信授業 (correspondence/distance)
#   - on_campus: スクーリング (on-campus)
#   - both: 両方
#   Only distance courses are handled so far. A schooling course should get its
#   own entry with `type: on_campus` rather than sharing one with the distance
#   version, because graduation rules count credits by how they were earned
#   (schooling needs 30+ credits in total and is capped within each area).
#
# Exam Groups (試験群):
#   A-F groups determine exam day/time slot per season.
#   See config/exam_timetable.yml for the schedule.
#
# Majors:
#   - all: Common courses for all majors
#   - economics: 経済学部
#   - law: 法学部
#   - literature: 文学部
#
# Required for (必修, optional):
#   required_for lists the majors for which the course is compulsory,
#   e.g. `required_for: [economics]`. Omit it for elective courses.

courses:
  # Humanities (人文科学分野)
