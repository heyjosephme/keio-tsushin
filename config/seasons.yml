# Keio Tsushin Exam Seasons
# Each season has (its display name is derived from exam_start, per language):
#   - report_deadline: Last day to submit reports
#   - application_deadline: Last day to apply for exams
#   - exam_start / exam_end: Exam period dates
#
# These dates are the same for all students.
# Update yearly based on official Keio calendar.

seasons:
